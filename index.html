<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SAMAAN" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>SAMAAN | سمان - سامانه مدیریت انبارهای نیروگاهی</title>
    <meta name="description" content="سمان - سامانه مدیریت انبارهای نیروگاهی | Power Plant Warehouse Management System" />
    <meta property="og:title" content="SAMAAN | سمان - سامانه مدیریت انبارهای نیروگاهی" />
    <meta property="og:description" content="سمان - سامانه مدیریت انبارهای نیروگاهی | Power Plant Warehouse Management System" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('samaan_user_preferences_v1');
          var parsed = raw ? JSON.parse(raw) : {};
          var isDark = parsed && parsed.theme === 'dark';
          var isEye = Boolean(parsed && parsed.eyeComfort);
          var root = document.documentElement;
          root.classList.toggle('dark', isDark);
          root.classList.toggle('light', !isDark);
          root.classList.toggle('eye-comfort', isEye);
          root.dataset.theme = isDark ? 'dark' : 'light';
          var cssScheme = isDark ? 'only dark' : 'only light';
          var metaScheme = isDark ? 'dark only' : 'light only';
          var themeColor = isDark ? (isEye ? '#171410' : '#0b111b') : (isEye ? '#f5efe3' : '#ffffff');
          var bgColor = isDark ? (isEye ? '#171410' : '#0b111b') : (isEye ? '#f5efe3' : '#f8fafc');
          var txtColor = isDark ? (isEye ? '#f3ebd8' : '#e6edf6') : (isEye ? '#2c251c' : '#0f172a');
          root.style.colorScheme = cssScheme;
          root.style.backgroundColor = bgColor;
          root.style.color = txtColor;
          var csMeta = document.querySelector('meta[name="color-scheme"]');
          if (csMeta) csMeta.setAttribute('content', metaScheme);
          var scsMeta = document.querySelector('meta[name="supported-color-schemes"]');
          if (scsMeta) scsMeta.setAttribute('content', metaScheme);
          var tcMeta = document.querySelector('meta[name="theme-color"]');
          if (tcMeta) tcMeta.setAttribute('content', themeColor);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
